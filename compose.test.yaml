# Apply with compose.yaml and --project-name tocaregalo-test; not standalone.
name: tocaregalo-test

x-test-environment: &test-environment
  APP_ENV: test
  DATABASE_URL: ${TEST_DATABASE_URL:?Set TEST_DATABASE_URL for the isolated test database}
  APP_PUBLIC_URL: http://localhost:${TEST_HTTP_PORT:-8081}

services:
  tocaregalo-mysql:
    environment:
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:-tocaregalo_test}

  tocaregalo-php:
    environment: *test-environment

  tocaregalo-notification-worker:
    environment: *test-environment

  tocaregalo-closure-worker:
    environment: *test-environment

  tocaregalo-frontend:
    environment:
      VITE_PUBLIC_PORT: ${TEST_HTTP_PORT:-8081}

  tocaregalo-nginx:
    ports: !override
      - "127.0.0.1:${TEST_HTTP_PORT:-8081}:80"

  tocaregalo-mailpit:
    ports: !override
      - "127.0.0.1:${TEST_MAILPIT_PORT:-8026}:8025"
