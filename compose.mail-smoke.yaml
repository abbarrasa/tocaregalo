# T6 only: dedicated local mail/worker checks; --project-name tocaregalo-test.
name: tocaregalo-test

x-php: &php
  image: ${PHP_LOCAL_IMAGE:-tocaregalo-php:dev}
  pull_policy: never
  user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
  working_dir: /workspace/backend
  init: true
  stop_signal: SIGTERM
  environment:
    APP_ENV: test
    RECOVERY_TEST_KEYS: "1"
    APP_DEBUG: '0'
    MAILER_DSN: smtp://tocaregalo-mailpit:1025
    MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=notifications&auto_setup=false
    APP_CACHE_DIR: /tmp/tocaregalo-t6-cache
    DATABASE_URL: ${TEST_DATABASE_URL:?Set TEST_DATABASE_URL in the private root .env}
    TEST_DATABASE_URL: ${TEST_DATABASE_URL:?Set TEST_DATABASE_URL in the private root .env}
    TEST_MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:?Set TEST_MYSQL_DATABASE in the private root .env}
  volumes:
    - ./backend:/workspace/backend
    - type: bind
      source: ./.env
      target: /workspace/.env
      read_only: true
      bind:
        create_host_path: false
    - ./docker/worker/entrypoint.sh:/runtime/worker.sh:ro
    - ./docker/scheduler/entrypoint.sh:/runtime/scheduler.sh:ro

services:
  tocaregalo-mysql:
    image: ${MYSQL_IMAGE:?Set the pinned MYSQL_IMAGE}
    pull_policy: never
    environment:
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:?Set TEST_MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci', '--default-time-zone=+00:00']
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  tocaregalo-php-tests:
    <<: *php
    profiles: ['checks']
    command: ['vendor/bin/phpunit']
    depends_on:
      tocaregalo-mysql:
        condition: service_healthy

  tocaregalo-mailpit:
    image: ${MAILPIT_IMAGE:?Set the pinned MAILPIT_IMAGE}
    pull_policy: never
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${TEST_MAILPIT_PORT:-8026}:8025"

  tocaregalo-notification-worker:
    <<: *php
    entrypoint: ["sh", "/runtime/worker.sh"]
    command: ["messenger:consume", "notifications", "--time-limit=60", "--no-interaction", "--quiet"]

  tocaregalo-closure-probe:
    <<: *php
    entrypoint: ["sh", "/runtime/scheduler.sh"]
    command: ["app:fixture:worker-probe", "--interval=15", "--cycles=2"]
