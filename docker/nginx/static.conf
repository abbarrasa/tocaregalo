# Loaded inside the official Nginx image's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # All backend responses come from the Symfony JSON entry point.
    location = /api {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /workspace/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass tocaregalo-php:9000;
    }

    location ^~ /api/ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /workspace/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass tocaregalo-php:9000;
    }

    # Private/configuration paths are never passed to the frontend dev server.
    location ~ /\. {
        deny all;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    root /usr/share/nginx/html;

    # User routes fall back to the compiled Vue entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
