services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Api\JsonResponseSubscriber: ~

    App\Infrastructure\Validation\UserInputValidator: ~
    App\Infrastructure\Security\SymfonyPasswordService: ~
    App\Infrastructure\Doctrine\DoctrineUserRepository: ~
    App\Application\Port\PasswordService: '@App\Infrastructure\Security\SymfonyPasswordService'
    App\Application\Port\UserRepository: '@App\Infrastructure\Doctrine\DoctrineUserRepository'
    App\Command\CreateSuperAdminCommand: ~
    App\Application\User\CreateSuperAdmin: ~
    App\Infrastructure\Doctrine\DoctrineSuperAdminStore: ~
    App\Application\Port\SuperAdminStore: '@App\Infrastructure\Doctrine\DoctrineSuperAdminStore'
    App\Infrastructure\Security\SessionUserProvider: ~
    App\Infrastructure\Security\SessionAuthenticator: ~
    App\Api\SessionController:
        tags: ['controller.service_arguments']
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            $pdoOrDsn: '%env(resolve:DATABASE_URL)%'
