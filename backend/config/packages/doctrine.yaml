doctrine:
    dbal:
        driver: pdo_mysql
        url: '%env(resolve:DATABASE_URL)%'
        charset: utf8mb4
        # PDO MySQL initialization command: every connection uses UTC instants.
        options:
            1002: "SET time_zone = '+00:00'"
    orm:
        auto_mapping: false
        mappings:
            Identity:
                type: xml
                dir: '%kernel.project_dir%/config/doctrine'
                prefix: 'App\Infrastructure\Doctrine\Record'
                is_bundle: false
