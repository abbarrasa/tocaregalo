# Loaded inside the official Nginx image's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # All backend responses come from the Symfony JSON entry point.
    location = /api {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /workspace/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass tocaregalo-php:9000;
    }

    location ^~ /api/ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /workspace/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass tocaregalo-php:9000;
    }

    # Private/configuration paths are never passed to the frontend dev server.
    location ~ /\. {
        deny all;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    # Vue/Vite owns user views and HMR; the backend does not render templates.
    location / {
        proxy_pass http://tocaregalo-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
