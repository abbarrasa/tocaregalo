parameters:
    recovery_empty_key: ""
    recovery_default_ttl: 3600

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Api\JsonResponseSubscriber: ~

    App\Infrastructure\Validation\UserInputValidator: ~
    App\Infrastructure\Security\SymfonyPasswordService: ~
    App\Infrastructure\Doctrine\DoctrineUserRepository: ~
    App\Application\Port\PasswordService: '@App\Infrastructure\Security\SymfonyPasswordService'
    App\Application\Port\UserRepository: '@App\Infrastructure\Doctrine\DoctrineUserRepository'
    App\Command\CreateSuperAdminCommand: ~
    App\Application\User\CreateSuperAdmin: ~
    App\Infrastructure\Doctrine\DoctrineSuperAdminStore: ~
    App\Application\Port\SuperAdminStore: '@App\Infrastructure\Doctrine\DoctrineSuperAdminStore'
    App\Infrastructure\Security\SessionUserProvider: ~
    App\Infrastructure\Security\SessionAuthenticator: ~
    App\Api\SessionController:
        tags: ['controller.service_arguments']
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            $pdoOrDsn: '%env(resolve:DATABASE_URL)%'
    App\Application\User\AccountInput: ~
    App\Application\User\AccountUniqueness: ~
    App\Application\User\CreateOrdinaryUser: ~
    App\Application\User\UpdateOwnAccount: ~
    App\Infrastructure\Doctrine\DoctrineAccountStore: ~
    App\Application\Port\AccountStore: '@App\Infrastructure\Doctrine\DoctrineAccountStore'
    App\Application\Port\ProfileValidator: '@App\Infrastructure\Validation\UserInputValidator'
    App\Api\OwnAccountController:
        tags: ['controller.service_arguments']
    App\Infrastructure\Time\SystemClock: ~
    App\Application\Port\Clock: '@App\Infrastructure\Time\SystemClock'
    App\Infrastructure\Doctrine\DoctrineRecoveryStore: ~
    App\Application\Port\RecoveryStore: '@App\Infrastructure\Doctrine\DoctrineRecoveryStore'
    App\Application\Recovery\RecoveryLifetime:
        arguments:
            $seconds: '%env(default:recovery_default_ttl:PASSWORD_RESET_TTL_SECONDS)%'
    App\Application\Recovery\RecoveryTokens: ~
    App\Application\Recovery\RequestRecovery: ~
    App\Infrastructure\Mail\RecoveryEnvelope:
        arguments:
            $encodedKey: '%env(default:recovery_empty_key:RECOVERY_DELIVERY_KEY)%'
    App\Infrastructure\Mail\RecoveryLink:
        arguments:
            $publicUrl: '%env(APP_PUBLIC_URL)%'
            $environment: '%kernel.environment%'
    App\Infrastructure\Mail\RecoveryDeliveryStore: ~
    App\Application\Port\RecoveryDelivery: '@App\Infrastructure\Mail\RecoveryDeliveryStore'
    App\Infrastructure\Mail\RecoveryMailHandler: ~
    App\Infrastructure\Mail\RecoveryWorkerEvents: ~
    App\Api\RecoveryController:
        tags: ['controller.service_arguments']
    App\Infrastructure\Mail\RecoveryRetryContext: ~
